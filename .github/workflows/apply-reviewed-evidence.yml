name: Apply reviewed evidence changes
on:
  push:
    branches: [review/20260918-evidence-accuracy]
permissions:
  contents: read
jobs:
  apply:
    if: contains(github.event.head_commit.message, '[apply-reviewed-evidence]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch the immutable same-repository source audit artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/jd92-beep/hk-insurance-compare/actions/artifacts/10542892013/zip > /tmp/source-status.zip
      - run: python -m pip install PyMuPDF==1.26.7
      - name: Apply only the locally reviewed bytes
        run: python .review-delivery/apply.py
      - name: Run application quality gates
        run: |
          npm ci
          npm test
          npm run lint -- --max-warnings=0
          npm run build
          npm run test:filters
          python -m unittest discover -s tests -p '*evidence*.py'
      - name: Commit verified changes to the review branch only
        run: |
          test "$GITHUB_REF_NAME" = 'review/20260918-evidence-accuracy'
          python - <<'PY'
          import json, subprocess
          for path in json.load(open('/tmp/review-changed.json')):
              subprocess.run(['git','add','--',path], check=True)
          PY
          git rm -r -- .review-delivery .github/workflows/apply-reviewed-evidence.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(evidence): block unverifiable quotes, correct reviewed limits and publish catalogue audit'
          git push origin HEAD:refs/heads/review/20260918-evidence-accuracy
          git rev-parse HEAD > /tmp/applied-head.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reviewed-evidence-delivery
          path: |
            /tmp/received-payload.b64
            /tmp/review-changed.json
            /tmp/applied-head.txt
          retention-days: 1
          if-no-files-found: warn
