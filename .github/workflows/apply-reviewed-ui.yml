name: Apply reviewed plain-language and depth changes
on:
  push:
    branches: [review/20260918-readable-depth]
permissions:
  contents: read
jobs:
  apply:
    if: contains(github.event.head_commit.message, '[apply-reviewed-ui]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyMuPDF==1.26.7
      - name: Apply locally tested bytes with exact before and after digests
        run: python .review-delivery/apply.py
      - name: Run all application and maintenance gates
        run: |
          npm ci
          npm audit --json > /tmp/npm-audit.json || test "$?" -eq 1
          npm test
          npm run lint -- --max-warnings=0
          npm run build
          npm run test:filters
          npm run check:maintenance
          python -m unittest discover -s tests -p 'test_evidence_audit.py'
      - name: Commit tested edits to the isolated review branch
        run: |
          test "$GITHUB_REF_NAME" = 'review/20260918-readable-depth'
          python - <<'PY'
          import json, subprocess
          for path in json.load(open('/tmp/review-changed.json')):
              subprocess.run(['git','add','--',path],check=True)
          PY
          git rm -r -- .review-delivery .github/workflows/apply-reviewed-ui.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: plain-language insurance comparisons, faceted depth and reviewed documentation'
          git push origin HEAD:refs/heads/review/20260918-readable-depth
          git rev-parse HEAD > /tmp/applied-head.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reviewed-ui-delivery
          path: |
            /tmp/received-ui.b64
            /tmp/review-changed.json
            /tmp/applied-head.txt
            /tmp/npm-audit.json
          retention-days: 1
          if-no-files-found: warn
