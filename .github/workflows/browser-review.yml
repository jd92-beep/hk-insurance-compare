name: Browser review
on:
  pull_request:
    branches: [master, "review/**"]
permissions:
  contents: read
concurrency:
  group: browser-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install isolated pinned browser tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-tools" --no-save --ignore-scripts playwright@1.63.0
          node "$RUNNER_TEMP/browser-tools/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Desktop/mobile routes and PDF interactions
        env:
          AUDIT_STRICT: "false"
        run: |
          node node_modules/vite/bin/vite.js preview --host 127.0.0.1 --port 4173 > /tmp/insurance-preview.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          for attempt in $(seq 1 30); do curl -sf http://127.0.0.1:4173/ > /dev/null && break; sleep 1; done
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/browser-tools/node_modules/playwright/index.mjs"
          node scripts/browser_review.mjs
          node scripts/browser_pdf_review.mjs
          node scripts/browser_pdf_integrity_review.mjs
          node scripts/browser_stamp_review.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-review-${{ github.event.pull_request.head.sha }}
          path: browser-evidence/
          retention-days: 7
          if-no-files-found: error
