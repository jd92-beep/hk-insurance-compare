name: All-category interaction tests
on:
  pull_request:
    branches: [master, "review/**"]
permissions:
  contents: read
jobs:
  categories:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: |
          npm install --prefix "$RUNNER_TEMP/browser-tools" --no-save --ignore-scripts playwright@1.63.0
          node "$RUNNER_TEMP/browser-tools/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Exercise every category on desktop and mobile
        run: |
          node node_modules/vite/bin/vite.js preview --host 127.0.0.1 --port 4173 >/tmp/preview.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          for n in $(seq 1 30); do curl -sf http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/browser-tools/node_modules/playwright/index.mjs" node scripts/browser_category_review.mjs
      - name: Dependency diagnostics (report, not a security clearance)
        if: always()
        run: |
          mkdir -p category-evidence
          npm audit --json > category-evidence/npm-audit.json || test -s category-evidence/npm-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: category-interactions-${{ github.sha }}
          path: category-evidence/
          retention-days: 7
