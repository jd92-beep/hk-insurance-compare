name: CI
permissions:
  contents: read
on:
  push:
    branches: [master, "review/**"]
  pull_request:
    branches: [master, "review/**"]
jobs:
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: ESLint (zero errors and warnings)
        run: npm run lint -- --max-warnings=0
      - name: Targeted regression tests
        run: npm test
      - name: TypeScript and production build
        run: npm run build
      - name: Filter regression and boundary tests
        run: npm run test:filters
