name: Citation ingestion integrity
on:
  pull_request:
    branches: [master, "review/**"]
permissions:
  contents: read
concurrency:
  group: citation-curation-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  curation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/curation-requirements.txt
      - run: python -m pip install --disable-pip-version-check -r scripts/curation-requirements.txt
      - name: Fail-closed curation and real-PDF CLI regression
        run: python -m unittest discover -s tests -p test_citation_ingest.py -v
      - name: Source datasets and PDFs must remain unchanged
        run: git diff --exit-code -- public/data public/docs
