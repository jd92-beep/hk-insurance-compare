name: Complete product and site verification
on:
  pull_request:
    branches: [master, "review/**"]
permissions:
  contents: read
jobs:
  products:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: |
          npm install --prefix "$RUNNER_TEMP/browser-tools" --no-save --ignore-scripts playwright@1.63.0
          node "$RUNNER_TEMP/browser-tools/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Verify every product, landing, mobile overflow and data retry
        run: |
          node node_modules/vite/bin/vite.js preview --host 127.0.0.1 --port 4173 >/tmp/preview.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          for n in $(seq 1 30); do curl -sf http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/browser-tools/node_modules/playwright/index.mjs" node scripts/browser_complete_review.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: complete-site-${{ github.sha }}
          path: complete-evidence/
          retention-days: 7
