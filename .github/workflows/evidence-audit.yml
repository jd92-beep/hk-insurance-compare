name: Evidence audit reproducibility
on:
  pull_request:
    branches: [master, "review/**"]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyMuPDF==1.26.7
      - run: python -m unittest discover -s tests -p 'test_evidence_audit.py'
      - name: Rebuild ledger using its recorded audit date
        run: |
          date=$(python -c 'import json; print(json.load(open("public/data/evidence-audit.json"))["audited_at"])')
          python scripts/audit_evidence.py --as-of "$date"
          git diff --exit-code -- public/data/evidence-audit.json docs/review/05-evidence-audit.md
