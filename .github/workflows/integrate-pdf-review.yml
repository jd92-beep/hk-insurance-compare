name: Integrate PDF review branch
on:
  push:
    branches: [review/03-pdf-evidence]
permissions:
  contents: read
jobs:
  integrate:
    if: github.ref == 'refs/heads/review/03-pdf-evidence'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply reviewed integration to this branch only
        env:
          EXPECTED: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -f .review/integrate-pdf.py || exit 0
          test "$(git ls-remote origin refs/heads/review/03-pdf-evidence | cut -f1)" = "$EXPECTED"
          python .review/integrate-pdf.py
          npm ci
          npm test
          npm run lint -- --max-warnings=0
          npm run build
          git add src .gitignore package.json package-lock.json scripts
          git rm .review/integrate-pdf.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(pdf): integrate evidence center, safe citation links and pinned renderer'
          git push origin HEAD:refs/heads/review/03-pdf-evidence
