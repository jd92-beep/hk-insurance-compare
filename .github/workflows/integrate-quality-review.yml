name: Integrate quality review branch
on:
  push:
    branches: [review/07-site-quality]
permissions:
  contents: read
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply and verify reviewed integration
        env:
          EXPECTED: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -f .review/integrate-quality.py || exit 0
          test "$(git ls-remote origin refs/heads/review/07-site-quality | cut -f1)" = "$EXPECTED"
          python .review/integrate-quality.py
          npm ci
          npm test
          npm run lint -- --max-warnings=0
          npm run build
          npm run test:filters
          git add src tests
          git rm .review/integrate-quality.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'perf: integrate split landing layers, lazy routes and resilient data loading'
          git push origin HEAD:refs/heads/review/07-site-quality
