name: Materialize reviewed patch
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  apply:
    if: github.head_ref == 'review/ci-evidence-20260906' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Apply reviewed application files only (workflows remain connector-managed)
        env:
          TARGET: review/ci-evidence-20260906
          EXPECTED: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test -f .review/change.patch || exit 0
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          test "$(git ls-remote origin "refs/heads/$TARGET" | cut -f1)" = "$EXPECTED"
          patch=$(mktemp)
          trap 'rm -f "$patch"' EXIT
          sed 's/^ diff --git /diff --git /' .review/change.patch > "$patch"
          echo "922ebfb02a09097608ddc7455eb57394106a1bc5c319333751e91c2dd9b7f3bc  $patch" | sha256sum --check
          git apply --check --index --exclude='.github/workflows/*' "$patch"
          git apply --index --exclude='.github/workflows/*' "$patch"
          git rm .review/change.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci: enforce lint policy and add browser audit script'
          git push origin "HEAD:refs/heads/$TARGET"
