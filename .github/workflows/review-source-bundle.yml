name: Review source bundle
on:
  push:
    branches: ["review/20260918-**"]
permissions:
  contents: read
jobs:
  source-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Package tracked review inputs without credentials or binary assets
        run: |
          python3 - <<'PY'
          import json, pathlib, subprocess, zipfile
          root = pathlib.Path('.')
          allowed = {'.ts', '.tsx', '.js', '.mjs', '.cjs', '.json', '.md', '.css', '.html', '.yml', '.yaml', '.py', '.txt'}
          tracked = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          paths = [p for p in tracked if p and pathlib.Path(p).is_file() and
                   (pathlib.Path(p).suffix in allowed or p in {'.nvmrc', '.gitignore'}) and
                   not any(part.startswith('.env') for part in pathlib.Path(p).parts)]
          sha = subprocess.check_output(['git', 'rev-parse', 'HEAD']).decode().strip()
          with zipfile.ZipFile('review-source.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for path in paths:
                  archive.write(path, path)
              archive.writestr('review-snapshot.json', json.dumps({'head': sha, 'files': paths, 'omitted': 'Binary assets/PDFs and environment files; not a policy validation.'}, indent=2))
          print(f'Packaged {len(paths)} tracked text files at {sha}')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: review-source-${{ github.sha }}
          path: review-source.zip
          retention-days: 7
          if-no-files-found: error
