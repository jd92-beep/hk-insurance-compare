name: Official source reachability review
on:
  push:
    branches: ["review/20260918-evidence-accuracy"]
permissions:
  contents: read
jobs:
  sources:
    if: contains(github.event.head_commit.message, '[source-review]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check public source endpoints without certifying policy content
        run: python3 scripts/check_official_sources.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-source-status-${{ github.sha }}
          path: source-review-output/
          retention-days: 7
          if-no-files-found: error
