name: Search accessibility
on:
  pull_request:
    branches: [master, "review/**"]
permissions:
  contents: read
concurrency:
  group: search-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  keyboard:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Browser dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-tools" --no-save --ignore-scripts playwright@1.63.0
          node "$RUNNER_TEMP/browser-tools/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Keyboard and focus regression
        run: |
          node node_modules/vite/bin/vite.js preview --host 127.0.0.1 --port 4173 > /tmp/search-preview.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          for attempt in $(seq 1 30); do curl -sf http://127.0.0.1:4173/ > /dev/null && break; sleep 1; done
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/browser-tools/node_modules/playwright/index.mjs"
          node scripts/browser_search_review.mjs
          node scripts/browser_compare_store_review.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: search-accessibility-${{ github.event.pull_request.head.sha }}
          path: browser-evidence/
          retention-days: 7
