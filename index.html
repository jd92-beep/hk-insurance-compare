<!doctype html>
<html lang="zh-Hant-HK">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F7F4EE" />
    <link rel="icon" type="image/svg+xml" href="/logo-mark.svg" />
    <title>保險格價站 HK InsureCompare — 逐份官方文件幫你睇</title>
    <meta name="description" content="比較香港 9 大保險類別、85 份真實保單、27 間保險公司。保障範圍、價錢、條款逐項並排，全部附有保險公司官方來源。" />
    <meta property="og:title" content="保險格價站 HK InsureCompare" />
    <meta property="og:description" content="逐份官方文件幫你睇——9 大類別 · 85 份保單 · 27 間保險公司，全部有官方出處。" />
    <meta property="og:image" content="/og-cover.svg" />
    <!-- Instant paper background before CSS/JS paint; avoids white flash on first show-up. -->
    <style>
      html,
      body {
        background: #f7f4ee;
        color: #181d2e;
        margin: 0;
      }
    </style>
    <!-- Start insurance snapshot early; matches fetch() CORS preload rules. -->
    <link rel="preload" href="/data/insurance-data.json" as="fetch" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Google Fonts CSS is large (CJK families). Load non-blocking so first paint
      uses system stack; display=swap still applies once CSS arrives.
    -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700;900&family=Noto+Sans+TC:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700;900&family=Noto+Sans+TC:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700;900&family=Noto+Sans+TC:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
