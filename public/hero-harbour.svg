<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" fill="none">
  <defs>
    <filter id="hh-grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.55  0 0 0 0 0.53  0 0 0 0 0.48  0 0 0 0.05 0"/>
    </filter>
    <linearGradient id="hh-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F9F6F0"/>
      <stop offset="1" stop-color="#F1ECE2"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#hh-sky)"/>

  <!-- 紅圓日 / 印章 -->
  <circle cx="1180" cy="470" r="300" fill="#C8102E"/>
  <circle cx="1180" cy="470" r="300" fill="none" stroke="#9E0C24" stroke-width="3" opacity="0.35"/>
  <circle cx="1180" cy="470" r="262" fill="none" stroke="#F7F4EE" stroke-width="2" opacity="0.5"/>

  <!-- 遠山層 -->
  <path d="M0 560 L180 430 L330 520 L520 400 L700 540 L880 470 L1080 560 L1300 440 L1500 560 L1700 480 L1920 570 L1920 760 L0 760 Z" fill="#181D2E" opacity="0.14"/>

  <!-- 後排天際線（淡墨藍） -->
  <g fill="#181D2E" opacity="0.42">
    <rect x="120" y="500" width="70" height="280"/>
    <rect x="240" y="440" width="56" height="340"/>
    <rect x="330" y="520" width="86" height="260"/>
    <rect x="1500" y="470" width="64" height="310"/>
    <rect x="1610" y="520" width="90" height="260"/>
    <rect x="1750" y="450" width="58" height="330"/>
  </g>

  <!-- 中排：IFC 式高塔 + 中銀式斜紋塔（主剪影） -->
  <g fill="#181D2E">
    <!-- IFC 式 -->
    <path d="M560 780 L560 300 Q560 250 610 250 Q660 250 660 300 L660 780 Z"/>
    <rect x="596" y="205" width="28" height="60"/>
    <!-- 中銀式斜紋 -->
    <g>
      <path d="M760 780 L760 360 L850 250 L940 360 L940 780 Z"/>
      <g stroke="#F7F4EE" stroke-width="7" opacity="0.9">
        <path d="M760 430 L940 560 M940 430 L760 560"/>
        <path d="M760 590 L940 720 M940 590 L760 720"/>
        <path d="M850 250 L850 780"/>
      </g>
    </g>
    <!-- 中環廣場式 -->
    <path d="M1010 780 L1010 330 L1065 300 L1120 330 L1120 780 Z"/>
    <rect x="1058" y="230" width="14" height="90"/>
    <!-- 右側群樓 -->
    <rect x="1180" y="560" width="80" height="220"/>
    <rect x="1300" y="500" width="60" height="280"/>
    <path d="M1400 780 L1400 420 L1460 420 L1460 780 Z"/>
    <!-- 左側群樓 -->
    <rect x="300" y="600" width="90" height="180"/>
    <path d="M430 780 L430 480 L500 480 L500 780 Z"/>
    <rect x="180" y="640" width="70" height="140"/>
  </g>

  <!-- 前排小樓（更深） -->
  <g fill="#10152A">
    <rect x="80" y="680" width="120" height="120"/>
    <rect x="240" y="700" width="60" height="100"/>
    <rect x="520" y="660" width="100" height="140"/>
    <rect x="980" y="640" width="90" height="160"/>
    <rect x="1340" y="670" width="110" height="130"/>
    <rect x="1560" y="700" width="140" height="100"/>
    <rect x="1760" y="660" width="90" height="140"/>
  </g>

  <!-- 海面髮線波紋 -->
  <g stroke="#181D2E" stroke-width="1.4" opacity="0.5" stroke-linecap="round">
    <path d="M0 812 Q120 806 240 812 T480 812 T720 812 T960 812 T1200 812 T1440 812 T1680 812 T1920 812"/>
    <path d="M0 848 Q150 842 300 848 T600 848 T900 848 T1200 848 T1500 848 T1800 848 T1920 848" opacity="0.8"/>
    <path d="M0 886 Q180 880 360 886 T720 886 T1080 886 T1440 886 T1800 886 T1920 886" opacity="0.62"/>
    <path d="M0 926 Q200 920 400 926 T800 926 T1200 926 T1600 926 T1920 926" opacity="0.45"/>
    <path d="M0 968 Q220 962 440 968 T880 968 T1320 968 T1760 968 T1920 968" opacity="0.3"/>
    <path d="M0 1012 Q240 1006 480 1012 T960 1012 T1440 1012 T1920 1012" opacity="0.18"/>
  </g>
  <g stroke="#C8102E" stroke-width="1.6" opacity="0.55" stroke-linecap="round">
    <path d="M880 830 Q960 826 1040 830 T1200 830"/>
    <path d="M300 900 Q380 896 460 900"/>
    <path d="M1450 940 Q1540 936 1630 940"/>
  </g>

  <!-- 帆船剪影 -->
  <g fill="#181D2E">
    <path d="M690 806 L740 806 L730 818 L700 818 Z"/>
    <path d="M714 804 L714 742 L744 800 Z"/>
    <path d="M710 804 L710 758 L684 800 Z"/>
  </g>

  <!-- 漂浮小盾 -->
  <g stroke-linejoin="round">
    <g transform="translate(240 210) rotate(-8)">
      <path d="M0 0 44 10.6v26c0 20-18.5 33-44 40-25.5-7-44-20-44-40v-26L0 0Z" fill="#0E7C66" opacity="0.92"/>
      <path d="M0 10 34 18v20c0 15-14 25-34 31-20-6-34-16-34-31V18L0 10Z" fill="none" stroke="#F7F4EE" stroke-width="2.4" opacity="0.85"/>
    </g>
    <g transform="translate(1560 170) rotate(10) scale(0.82)">
      <path d="M0 0 44 10.6v26c0 20-18.5 33-44 40-25.5-7-44-20-44-40v-26L0 0Z" fill="#D98E04" opacity="0.92"/>
      <path d="M0 10 34 18v20c0 15-14 25-34 31-20-6-34-16-34-31V18L0 10Z" fill="none" stroke="#F7F4EE" stroke-width="2.4" opacity="0.85"/>
    </g>
    <g transform="translate(1720 620) rotate(-14) scale(0.66)">
      <path d="M0 0 44 10.6v26c0 20-18.5 33-44 40-25.5-7-44-20-44-40v-26L0 0Z" fill="#2E6FDB" opacity="0.92"/>
      <path d="M0 10 34 18v20c0 15-14 25-34 31-20-6-34-16-34-31V18L0 10Z" fill="none" stroke="#F7F4EE" stroke-width="2.4" opacity="0.85"/>
    </g>
    <g transform="translate(420 350) rotate(6) scale(0.5)">
      <path d="M0 0 44 10.6v26c0 20-18.5 33-44 40-25.5-7-44-20-44-40v-26L0 0Z" fill="#C8102E" opacity="0.9"/>
    </g>
  </g>

  <!-- 紙紋 -->
  <rect width="1920" height="1080" filter="url(#hh-grain)"/>
</svg>
